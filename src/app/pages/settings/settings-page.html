<ion-header class="ion-no-border tb-header">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home" text="" /></ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="tb-content">
  <div class="tb-container tb-container--narrow">
    <app-display-choices />

    <section class="tb-section" aria-labelledby="about-title">
      <div class="tb-section-head"><h2 id="about-title">About</h2></div>
      <dl class="about tb-tile">
        <div><dt>Translation</dt><dd>Sahih International</dd></div>
        <div><dt>Saved on this device</dt><dd>Theme, Quran text choices, text size and where you stopped reading</dd></div>
        <div><dt>Server</dt><dd class="mono">{{ apiUrl }}</dd></div>
      </dl>
    </section>
  </div>
</ion-content>
